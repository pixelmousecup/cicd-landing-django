name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  lint:
    name: 1. Linter Check (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 linter
        run: flake8 .

  test:
    name: 2. Run Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit & Django tests
        run: pytest -v

  deploy:
    name: 3. Build & Deploy Docker to Prod VM
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-landing-app .

      - name: Stop old container if running
        run: docker rm -f cicd-landing-container || true

      - name: Run new container
        run: docker run -d --name cicd-landing-container -p 8000:8000 --restart always cicd-landing-app
